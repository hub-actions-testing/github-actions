name: Print GitHub Actions Variables

on:
  workflow_dispatch:

jobs:
  print-variables:
    runs-on: ubuntu-latest

    steps:

      - name: Print GitHub Variables
        run: |
          echo "========================================"
          echo "       GITHUB ACTIONS VARIABLES"
          echo "========================================"

          echo "GITHUB_ACTION       = $GITHUB_ACTION"
          echo "GITHUB_ACTION_PATH  = $GITHUB_ACTION_PATH"
          echo "GITHUB_ACTION_REPOSITORY = $GITHUB_ACTION_REPOSITORY"
          echo "GITHUB_ACTOR        = $GITHUB_ACTOR"
          echo "GITHUB_ACTOR_ID     = $GITHUB_ACTOR_ID"
          echo "GITHUB_API_URL      = $GITHUB_API_URL"
          echo "GITHUB_BASE_REF     = $GITHUB_BASE_REF"
          echo "GITHUB_ENV          = $GITHUB_ENV"
          echo "GITHUB_EVENT_NAME   = $GITHUB_EVENT_NAME"
          echo "GITHUB_EVENT_PATH   = $GITHUB_EVENT_PATH"
          echo "GITHUB_GRAPHQL_URL  = $GITHUB_GRAPHQL_URL"
          echo "GITHUB_HEAD_REF     = $GITHUB_HEAD_REF"
          echo "GITHUB_JOB          = $GITHUB_JOB"
          echo "GITHUB_OUTPUT       = $GITHUB_OUTPUT"
          echo "GITHUB_PATH         = $GITHUB_PATH"
          echo "GITHUB_REF         = $GITHUB_REF"
          echo "GITHUB_REF_NAME     = $GITHUB_REF_NAME"
          echo "GITHUB_REF_PROTECTED = $GITHUB_REF_PROTECTED"
          echo "GITHUB_REF_TYPE     = $GITHUB_REF_TYPE"
          echo "GITHUB_REPOSITORY   = $GITHUB_REPOSITORY"
          echo "GITHUB_REPOSITORY_ID = $GITHUB_REPOSITORY_ID"
          echo "GITHUB_REPOSITORY_OWNER = $GITHUB_REPOSITORY_OWNER"
          echo "GITHUB_REPOSITORY_OWNER_ID = $GITHUB_REPOSITORY_OWNER_ID"
          echo "GITHUB_RETENTION_DAYS = $GITHUB_RETENTION_DAYS"
          echo "GITHUB_RUN_ATTEMPT  = $GITHUB_RUN_ATTEMPT"
          echo "GITHUB_RUN_ID       = $GITHUB_RUN_ID"
          echo "GITHUB_RUN_NUMBER   = $GITHUB_RUN_NUMBER"
          echo "GITHUB_SERVER_URL   = $GITHUB_SERVER_URL"
          echo "GITHUB_SHA         = $GITHUB_SHA"
          echo "GITHUB_STEP_SUMMARY = $GITHUB_STEP_SUMMARY"
          echo "GITHUB_TRIGGERING_ACTOR = $GITHUB_TRIGGERING_ACTOR"
          echo "GITHUB_WORKFLOW     = $GITHUB_WORKFLOW"
          echo "GITHUB_WORKFLOW_REF = $GITHUB_WORKFLOW_REF"
          echo "GITHUB_WORKFLOW_SHA = $GITHUB_WORKFLOW_SHA"
          echo "GITHUB_WORKSPACE    = $GITHUB_WORKSPACE"

          echo ""
          echo "========================================"
          echo "           RUNNER VARIABLES"
          echo "========================================"

          echo "RUNNER_ARCH         = $RUNNER_ARCH"
          echo "RUNNER_DEBUG        = $RUNNER_DEBUG"
          echo "RUNNER_NAME         = $RUNNER_NAME"
          echo "RUNNER_OS           = $RUNNER_OS"
          echo "RUNNER_TEMP         = $RUNNER_TEMP"
          echo "RUNNER_TOOL_CACHE   = $RUNNER_TOOL_CACHE"

          echo ""
          echo "========================================"
          echo "           CI VARIABLES"
          echo "========================================"

          echo "CI                  = $CI"

      - name: Print GitHub Context Variables
        run: |
          echo "========================================"
          echo "           GITHUB CONTEXT"
          echo "========================================"

          echo "Repository          = ${{ github.repository }}"
          echo "Repository Owner    = ${{ github.repository_owner }}"
          echo "Repository ID       = ${{ github.repository_id }}"
          echo "Actor               = ${{ github.actor }}"
          echo "Actor ID            = ${{ github.actor_id }}"
          echo "Triggering Actor    = ${{ github.triggering_actor }}"

          echo "Event Name          = ${{ github.event_name }}"
          echo "Event Action        = ${{ github.event.action }}"

          echo "Ref                 = ${{ github.ref }}"
          echo "Ref Name            = ${{ github.ref_name }}"
          echo "Ref Type            = ${{ github.ref_type }}"
          echo "SHA                 = ${{ github.sha }}"

          echo "Workflow            = ${{ github.workflow }}"
          echo "Workflow Ref        = ${{ github.workflow_ref }}"
          echo "Workflow SHA        = ${{ github.workflow_sha }}"

          echo "Run ID              = ${{ github.run_id }}"
          echo "Run Number          = ${{ github.run_number }}"
          echo "Run Attempt         = ${{ github.run_attempt }}"

          echo "Job                 = ${{ github.job }}"
          echo "Server URL          = ${{ github.server_url }}"
          echo "API URL             = ${{ github.api_url }}"
          echo "GraphQL URL         = ${{ github.graphql_url }}"
          echo "Workspace           = ${{ github.workspace }}"
